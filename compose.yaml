name: enhara

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enhara}
      POSTGRES_USER: ${POSTGRES_USER:-enhara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enhara}
    ports:
      - "5432:5432"
    volumes:
      - enhara_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-enhara} -d ${POSTGRES_DB:-enhara}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./apps/backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/enhara}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-enhara}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-enhara}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep -q UP",
        ]
      interval: 8s
      timeout: 4s
      retries: 15
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  enhara_postgres:
