spring:
  datasource:
    url: jdbc:h2:file:../../.data/demo/enhara;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

enhara:
  demo:
    seed: true
    auto-start-simulation: false
  vehicle-photos:
    directory: ../../.data/demo/vehicle-photos
