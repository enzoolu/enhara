spring:
  datasource:
    url: jdbc:h2:mem:enhara;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

enhara:
  demo:
    seed: true
    auto-start-simulation: false
