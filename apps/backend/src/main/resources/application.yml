spring:
  application:
    name: Enhara API
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/enhara}
    username: ${DATABASE_USERNAME:enhara}
    password: ${DATABASE_PASSWORD:enhara}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    document-title: Enhara API

enhara:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
  diagnostics:
    engine-temperature-high-celsius: 105
    battery-voltage-low: 12.0
    engine-overspeed-rpm: 6000
    fuel-level-low-percent: 15
  vehicle-photos:
    directory: ${VEHICLE_PHOTOS_DIR:.data/vehicle-photos}
  vehicle-data:
    brasil-api-base-url: ${BRASIL_API_BASE_URL:https://brasilapi.com.br/api}
    nhtsa-base-url: ${NHTSA_VPIC_BASE_URL:https://vpic.nhtsa.dot.gov/api}
